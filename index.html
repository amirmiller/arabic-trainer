<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e7490">
<title>תרגול ערבית מדוברת</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#334155;
    --txt:#f1f5f9; --muted:#94a3b8;
    --accent:#22d3ee; --accent2:#0e7490;
    --good:#22c55e; --good-bg:#14532d;
    --bad:#ef4444; --bad-bg:#7f1d1d;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:"Segoe UI","Helvetica Neue",Arial,"Arial Hebrew",sans-serif;}
  body{min-height:100dvh; display:flex; flex-direction:column;}
  .wrap{max-width:560px; width:100%; margin:0 auto; padding:14px 16px 28px; flex:1; display:flex; flex-direction:column;}

  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  header h1{font-size:18px; margin:0; font-weight:700;}
  .stats{display:flex; gap:14px; font-size:13px; color:var(--muted);}
  .stats b{color:var(--accent); font-size:15px;}

  /* settings bar */
  .bar{background:var(--card); border-radius:var(--radius); padding:12px; margin-bottom:14px;}
  .bar .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .bar .label{font-size:12px; color:var(--muted); width:100%; margin-bottom:2px;}
  .chip{border:1px solid var(--card2); background:transparent; color:var(--txt);
    padding:7px 13px; border-radius:999px; font-size:14px; cursor:pointer; transition:.15s;}
  .chip.on{background:var(--accent2); border-color:var(--accent2); color:#fff; font-weight:600;}
  .chip.on::before{content:"✓\00a0";}
  .chip:active{transform:scale(.95);}
  .bar + .bar{margin-top:-6px;}

  /* quiz card */
  .card{background:var(--card); border-radius:var(--radius); padding:26px 18px; text-align:center; margin-bottom:14px;}
  .dir{font-size:12px; color:var(--muted); margin-bottom:14px; letter-spacing:.5px;}
  .prompt{font-size:46px; font-weight:700; line-height:1.35; word-break:break-word;}
  .prompt.he{font-size:38px;}
  .sub{font-size:14px; color:var(--muted); margin-top:8px;}

  .options{display:grid; gap:10px;}
  .opt{background:var(--card); border:1.5px solid var(--card2); border-radius:14px;
    padding:16px 14px; font-size:21px; color:var(--txt); cursor:pointer; text-align:center;
    transition:.12s; line-height:1.3;}
  .opt:active{transform:scale(.98);}
  .opt.correct{background:var(--good-bg); border-color:var(--good); color:#dcfce7;}
  .opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:#fee2e2;}
  .opt.dim{opacity:.45;}
  .opt:disabled{cursor:default;}

  .next{margin-top:14px; width:100%; padding:16px; font-size:18px; font-weight:700;
    background:var(--accent); color:#06262e; border:none; border-radius:14px; cursor:pointer;}
  .next:active{transform:scale(.99);}
  .next[hidden]{display:none;}

  .empty{text-align:center; color:var(--muted); padding:40px 10px;}
  footer{text-align:center; color:var(--muted); font-size:11px; margin-top:auto; padding-top:14px;}
  .reveal{font-size:14px; color:var(--muted); margin-top:10px; min-height:18px;}
  .reveal b{color:var(--accent);}
  /* stats strip */
  .statsbar{display:flex; gap:8px; margin-bottom:14px;}
  .stat{flex:1; background:var(--card); border-radius:14px; padding:8px 4px 7px; text-align:center;}
  .stat b{display:block; color:var(--accent); font-size:21px; line-height:1.1; font-weight:700;}
  .stat span{font-size:11px; color:var(--muted);}
  /* milestone banner */
  .banner{position:fixed; top:14px; left:50%; transform:translate(-50%,-160%);
    background:linear-gradient(135deg,#0e7490,#22d3ee); color:#062a32;
    padding:12px 24px; border-radius:16px; box-shadow:0 10px 34px rgba(0,0,0,.45);
    text-align:center; z-index:60; opacity:0; pointer-events:none; max-width:90vw;
    transition:transform .35s cubic-bezier(.2,.9,.3,1.5), opacity .3s;}
  .banner.show{transform:translate(-50%,0); opacity:1;}
  .banner-ar{font-size:25px; font-weight:800; line-height:1.2;}
  .banner-he{font-size:13px; font-weight:600; opacity:.85; margin-top:3px;}
</style>
  <!-- pwa -->
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ערבית">
</head>
<body>
<div class="wrap">
  <header>
    <h1>תרגול ערבית מדוברת</h1>
  </header>
  <div class="statsbar">
    <div class="stat"><b id="sStreak">0</b><span>רצף</span></div>
    <div class="stat"><b id="sBest">0</b><span>שיא</span></div>
    <div class="stat"><b id="sCorrect">0</b><span>נכון</span></div>
    <div class="stat"><b id="sPct">—</b><span>הצלחה</span></div>
  </div>
  <div id="banner" class="banner"></div>

  <div class="bar">
    <div class="row"><span class="label">בחר רמות לתרגול — אפשר לסמן כמה יחד</span><span id="lessons" class="row" style="gap:8px"></span></div>
  </div>
  <div class="bar">
    <div class="row"><span class="label">כיוון התרגול</span>
      <button class="chip" data-dir="both">דו־כיווני</button>
      <button class="chip" data-dir="ar2he">ערבית ← עברית</button>
      <button class="chip" data-dir="he2ar">עברית ← ערבית</button>
    </div>
  </div>

  <div id="game"></div>

  <footer>הנתונים מבוססים על "קורס מתחילים: אוצר מילים" · ערבית מדוברת בכתב עברי מנוקד</footer>
</div>

<script>
/* ===== WORD DATA =====
   l = lesson (level), ar = Arabic word in Hebrew transliteration, he = Hebrew meaning */
let WORDS = [];

/* ===== STATE ===== */
const state = {
  lessons: new Set(),       // selected lesson numbers
  dir: "both",
  pool: [],
  current: null,
  answered: false,
  stats: null,
};

/* ===== HELPERS ===== */
const $ = s => document.querySelector(s);
let allLessons = [];
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ===== SETUP UI ===== */
function buildLessonChips(){
  const box = $("#lessons"); box.innerHTML="";
  const mk=(num,label)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label; b.dataset.lesson=num;
    b.onclick=()=>toggleLesson(num,b);
    return b;
  };
  const all=mk("all","הכול");
  all.onclick=()=>{ const on=state.lessons.size!==allLessons.length;
    state.lessons = on ? new Set(allLessons) : new Set();
    syncLessonChips(); savePrefs(); rebuild(); };
  box.appendChild(all);
  allLessons.forEach(n=> box.appendChild(mk(n,"שיעור "+n)));
  syncLessonChips();
}
function toggleLesson(num,btn){
  num=+num;
  if(state.lessons.has(num)) state.lessons.delete(num); else state.lessons.add(num);
  syncLessonChips(); savePrefs(); rebuild();
}
function syncLessonChips(){
  document.querySelectorAll('#lessons .chip').forEach(c=>{
    if(c.dataset.lesson==="all"){ c.classList.toggle("on", state.lessons.size===allLessons.length); }
    else c.classList.toggle("on", state.lessons.has(+c.dataset.lesson));
  });
}
document.querySelectorAll('[data-dir]').forEach(b=>{
  b.onclick=()=>{ state.dir=b.dataset.dir;
    document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle("on",x===b));
    savePrefs(); nextQuestion(); };
});

/* ===== GAME ===== */
function rebuild(){
  state.pool = WORDS.filter(w=> state.lessons.has(w.l));
  nextQuestion();
}
function nextQuestion(){
  const game=$("#game");
  if(state.pool.length<4){
    game.innerHTML=`<div class="card"><div class="empty">בחר שיעור אחד או יותר כדי להתחיל 👆</div></div>`;
    return;
  }
  const dir = state.dir==="both" ? (Math.random()<0.5?"ar2he":"he2ar") : state.dir;
  const word = pick(state.pool);
  const answerKey = dir==="ar2he" ? "he" : "ar";
  const promptKey = dir==="ar2he" ? "ar" : "he";

  // distractors: unique answer values, not equal to correct
  const correctVal = word[answerKey];
  const others = shuffle(state.pool.filter(w=> w[answerKey]!==correctVal));
  const seen=new Set([correctVal]); const distract=[];
  for(const w of others){ if(!seen.has(w[answerKey])){ seen.add(w[answerKey]); distract.push(w[answerKey]); } if(distract.length===3) break; }
  const options = shuffle([correctVal, ...distract]);

  state.current={word,dir,answerKey,correctVal};
  state.answered=false;

  const dirLabel = dir==="ar2he" ? "מה הפירוש בעברית?" : "איך אומרים בערבית?";
  const promptCls = promptKey==="he" ? "prompt he" : "prompt";

  game.innerHTML=`
    <div class="card">
      <div class="dir">${dirLabel}</div>
      <div class="${promptCls}">${word[promptKey]}</div>
    </div>
    <div class="options" id="opts"></div>
    <div class="reveal" id="reveal"></div>
    <button class="next" id="next" hidden>הבא ←</button>
  `;
  const optBox=$("#opts");
  options.forEach(val=>{
    const b=document.createElement("button");
    b.className="opt"; b.textContent=val;
    b.onclick=()=>answer(b,val);
    optBox.appendChild(b);
  });
  $("#next").onclick=nextQuestion;
}
function answer(btn,val){
  if(state.answered) return;
  state.answered=true;
  const {correctVal}=state.current;
  const buttons=[...document.querySelectorAll('.opt')];
  buttons.forEach(b=>{
    b.disabled=true;
    if(b.textContent===correctVal) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const ok = val===correctVal;
  const st=state.stats;
  st.totalAnswered++;
  if(ok){ st.totalCorrect++; st.curStreak++; if(st.curStreak>st.bestStreak) st.bestStreak=st.curStreak; }
  else { st.curStreak=0;
    $("#reveal").innerHTML = `התשובה הנכונה: <b>${correctVal}</b>`;
  }
  saveStats(); renderStats();
  if(ok && (st.curStreak===10 || st.curStreak===50)) showMilestone(st.curStreak);
  $("#next").hidden=false;
}

/* ===== PREFS (persist selected lessons + direction) ===== */
const PREFS_KEY="arabicTrainerPrefs";
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify({lessons:[...state.lessons], dir:state.dir})); }catch(e){}
}
function loadPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem(PREFS_KEY)||"null");
    if(!p) return false;
    if(Array.isArray(p.lessons)) state.lessons=new Set(p.lessons.filter(n=>allLessons.includes(n)));
    if(["both","ar2he","he2ar"].includes(p.dir)) state.dir=p.dir;
    return state.lessons.size>0;
  }catch(e){ return false; }
}

/* ===== STATS (persistent: total correct, best streak, success %) ===== */
const STATS_KEY="arabicTrainerStats";
function loadStats(){
  try{ const s=JSON.parse(localStorage.getItem(STATS_KEY)||"null");
    if(s&&typeof s==="object") return {totalCorrect:s.totalCorrect||0, totalAnswered:s.totalAnswered||0, bestStreak:s.bestStreak||0, curStreak:s.curStreak||0};
  }catch(e){}
  return {totalCorrect:0, totalAnswered:0, bestStreak:0, curStreak:0};
}
function saveStats(){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(state.stats)); }catch(e){} }
function renderStats(){
  const s=state.stats; if(!s) return;
  $("#sStreak").textContent=s.curStreak;
  $("#sBest").textContent=s.bestStreak;
  $("#sCorrect").textContent=s.totalCorrect;
  $("#sPct").textContent=s.totalAnswered ? Math.round(s.totalCorrect/s.totalAnswered*100)+"%" : "—";
}
function showMilestone(n){
  if(n===50) showBanner("מַשַאללַּה!", "וואו, איזה יופי · 50 ברצף");
  else showBanner("כֻּל אִלְאַחְתִרַאם", "כל הכבוד · 10 ברצף");
}
function showBanner(ar, he){
  const el=$("#banner");
  el.innerHTML='<div class="banner-ar">🎉 '+ar+'</div><div class="banner-he">'+he+'</div>';
  el.classList.add("show");
  clearTimeout(el._t);
  el._t=setTimeout(function(){ el.classList.remove("show"); }, 3200);
}

/* ===== LOAD WORDS (shared file on GitHub) ===== */
const WORDS_URL = 'https://raw.githubusercontent.com/amirmiller/arabic-trainer/main/words.json';
async function loadWords(){
  try{
    const res = await fetch(WORDS_URL + '?ts=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('http '+res.status);
    const data = await res.json();
    if(!Array.isArray(data) || !data.length) throw new Error('empty');
    localStorage.setItem('wordsCache', JSON.stringify(data));
    return data;
  }catch(e){
    const cached = localStorage.getItem('wordsCache');
    if(cached) return JSON.parse(cached);
    throw e;
  }
}

/* ===== INIT ===== */
(async () => {
  const game = $("#game");
  state.stats=loadStats(); renderStats();
  game.innerHTML = '<div class="card"><div class="empty">\u05d8\u05d5\u05e2\u05df \u05de\u05d9\u05dc\u05d9\u05dd\u2026</div></div>';
  try{
    WORDS = await loadWords();
  }catch(e){
    game.innerHTML = '<div class="card"><div class="empty">\u05dc\u05d0 \u05d4\u05e6\u05dc\u05d7\u05ea\u05d9 \u05dc\u05d8\u05e2\u05d5\u05df \u05d0\u05ea \u05e8\u05e9\u05d9\u05de\u05ea \u05d4\u05de\u05d9\u05dc\u05d9\u05dd.<br>\u05d1\u05d3\u05d5\u05e7 \u05d7\u05d9\u05d1\u05d5\u05e8 \u05dc\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8 \u05d5\u05e0\u05e1\u05d4 \u05e9\u05d5\u05d1.</div></div>';
    return;
  }
  allLessons = [...new Set(WORDS.map(w=>w.l))].sort((a,b)=>a-b);
  buildLessonChips();
  if(!loadPrefs()) state.lessons = new Set([allLessons[0]]);
  syncLessonChips();
  document.querySelector('[data-dir="'+state.dir+'"]').classList.add("on");
  rebuild();
})();
</script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
